<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Birja FIFA 24/7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<style>
/* Layout: broadcast-graphics league page. Big season numeral as the one bold move,
   a league table underneath, FIFA-style player cards, dream teams on a pitch. */
:root{
  --bg:#0a1012;
  --surface:#10181b;
  --surface-2:#162125;
  --line:#22313a;
  --line-soft:#1a262b;
  --fg:#e8eeec;
  --muted:#8497a0;
  --accent:#e4263e;
  --accent-soft:rgba(228,38,62,.14);
  --win:#34c88a;
  --win-soft:rgba(52,200,138,.15);
  --draw:#b7a35a;
  --draw-soft:rgba(183,163,90,.16);
  --loss:#f07585;
  --loss-soft:rgba(240,117,133,.14);
  --pitch-a:#0f2a20;
  --pitch-b:#0c241b;
  --pitch-line:#1e4a38;
  --f-display:'Barlow Condensed','Noto Sans Georgian','Arial Narrow',sans-serif;
  --f-body:'Barlow','Noto Sans Georgian','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:1040px;margin:0 auto}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{height:54px;width:auto;display:block;flex:none}
.brand .mark{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1}
.brand .mark i{font-style:normal;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:13px;white-space:nowrap}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#34505a}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5a2b33;color:var(--loss)}
.btn.sm{padding:4px 9px;font-size:12px}

/* season hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-block:28px 12px}
.numeral{font-family:var(--f-display);font-weight:700;line-height:.82;font-size:clamp(76px,17vw,150px);letter-spacing:-.01em;display:flex;align-items:flex-start;gap:8px}
.numeral small{font-size:.26em;letter-spacing:.06em;color:var(--accent);margin-top:.28em;font-weight:600}
.hero-sub{margin:10px 0 0;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:9px 16px;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.03em;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg.small button{font-size:15px;padding:6px 12px;font-family:var(--f-body);font-weight:500;letter-spacing:0}

/* view tabs */
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto}
.views button{background:none;border:0;padding:12px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.views button[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}

main{padding-top:22px;display:flex;flex-direction:column;gap:34px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 20px;color:var(--muted);text-align:center}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;min-width:0}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th.l,.tbl td.l{text-align:left}
.tbl th:first-child:not(.l){text-align:center}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--surface-2)}
.tbl td.rank{width:38px;color:var(--muted);font-family:var(--f-display);font-size:18px;text-align:center;padding-inline:6px}
.tbl tr.lead td.rank{color:var(--fg)}
.tbl tr.lead td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-weight:600}
.who .pair{display:flex;gap:6px}
.av{position:relative;width:var(--s,36px);height:var(--s,36px);border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:inline-grid;place-items:center;overflow:hidden;flex:none;font-family:var(--f-display);font-weight:700;font-size:calc(var(--s,36px)*.5);color:var(--muted)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.wp{display:inline-flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:54px}
.wp b{font-weight:600}
.wp .bar{display:block;width:54px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.wp .bar i{display:block;height:100%;background:var(--fg)}
.lead .wp .bar i{background:var(--accent)}
.fm{display:inline-flex;gap:3px}
.f{font-style:normal;width:19px;height:19px;border-radius:4px;display:inline-grid;place-items:center;font-size:11px;font-weight:600}
.fW{background:var(--win-soft);color:var(--win)}
.fD{background:var(--draw-soft);color:var(--draw)}
.fL{background:var(--loss-soft);color:var(--loss)}
.pos{color:var(--win)}.neg{color:var(--loss)}
.ph{position:relative;width:78px;height:78px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:inline-grid;place-items:center;overflow:hidden;flex:none;font-family:var(--f-display);font-weight:700;font-size:34px;color:var(--muted)}
.ph.sm{width:60px;height:60px;font-size:26px}
.tbl.big .pw{font-size:18px;gap:14px}
.stack{display:grid;gap:34px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 16%}
.tbl.big th{font-size:13px;padding:13px 12px;vertical-align:bottom}
.tbl.big td{padding:12px;font-size:17px}
.tbl.big td.rank{font-size:26px;width:52px}
.tbl.big .who{gap:16px;font-size:20px}
.tbl.big .wp{min-width:64px}.tbl.big .wp .bar{width:64px}
.tbl.big .f{width:22px;height:22px;font-size:12px}
.tbl .fm{flex-wrap:wrap;justify-content:flex-end;max-width:262px}
.tbl th .fseg{display:flex;margin-top:6px;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content;margin-left:auto}
.tbl th .fseg button{background:none;border:0;padding:3px 9px;font-size:11px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.tbl th .fseg button:last-child{border-right:0}
.tbl th .fseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.two{display:grid;grid-template-columns:1fr;gap:34px}

/* matchups */
.mu-list{display:grid;gap:10px}
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px}
.mu .t{font-weight:600;min-width:0}
.mu .t.r{text-align:right}
.mu .rec{text-align:center;font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;letter-spacing:.02em}
.mu .rec small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:5px}
.mu .rec em{font-style:normal;color:var(--muted);padding:0 3px}

/* player cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}
.pcard:hover{border-color:#3b5863}
.pc-photo{position:relative;display:block;aspect-ratio:4/4.6;background:
  radial-gradient(circle at 50% 108%, transparent 0 34%, var(--pitch-line) 34.5% 35.5%, transparent 36%),
  linear-gradient(180deg,var(--surface-2),var(--pitch-a))}
.pc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.pc-photo .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:120px;color:#1f3a33}
.pc-photo::after{content:"";position:absolute;inset:auto 0 0;height:46%;background:linear-gradient(180deg,transparent,rgba(10,16,18,.7) 45%,rgba(10,16,18,.97))}
.pc-rate{position:absolute;top:12px;right:12px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6)}
.pc-rate b{font-family:var(--f-display);font-size:46px;font-weight:700}
.pc-rate small{font-size:10px;color:#dfe8e6;letter-spacing:.08em;margin-top:3px}
.pc-name{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;font-family:var(--f-display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft)}
.pc-stats span{background:var(--surface);padding:9px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.pc-stats b{color:var(--fg);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

/* match grid */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mgh{grid-column:1/-1;font-family:var(--f-display);font-size:20px;letter-spacing:.04em;color:var(--muted);padding:10px 0 6px;border-bottom:1px solid var(--line)}
.mgh:first-child{padding-top:0}
.mc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px 11px;display:grid;gap:7px;min-width:0}
.mc-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.mc-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;color:var(--muted)}
.mc-r.win{color:var(--fg)}
.mc-r .nm{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-r.win .nm{font-weight:600}
.mc-r .cl{display:block;font-size:12px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-r .sc{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.pen{font-style:normal;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--win);background:var(--win-soft);border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:middle;line-height:1.3}
.pend{font-style:normal;color:var(--draw);background:var(--draw-soft);border-radius:3px;padding:1px 6px;margin-left:8px;font-size:10px;font-weight:600}
.note{border:1px solid #5b5230;background:var(--draw-soft);color:#e3d79a;border-radius:8px;padding:10px 14px;font-size:13px}
.mc .macts{display:flex;gap:6px;margin-top:2px}

/* pitch */
.dream-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.dteam{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.dt-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.dt-h .o{display:flex;align-items:center;gap:10px;min-width:0}
.dt-h h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.05}
.dt-h small{display:block;color:var(--muted);font-size:12px}
.dt-h .ov{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;text-align:right}
.dt-h .ov small{font-family:var(--f-body);font-weight:400;font-size:10px;letter-spacing:.08em}
.pitch{position:relative;display:flex;flex-direction:column;gap:16px;padding:18px 6px 14px;background:repeating-linear-gradient(180deg,var(--pitch-a) 0 44px,var(--pitch-b) 44px 88px);border-block:1px solid var(--pitch-line)}
.pitch::before{content:"";position:absolute;left:24%;right:24%;bottom:0;height:17%;border:1px solid var(--pitch-line);border-bottom:0}
.pitch::after{content:"";position:absolute;left:50%;top:-34px;width:68px;height:68px;margin-left:-34px;border-radius:50%;border:1px solid var(--pitch-line)}
.pl{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:4px}
.pp{width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pp b{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-weight:700}
.pp b.na{background:var(--surface-2);color:var(--muted)}
.pp span{font-size:12px;line-height:1.15;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp em{font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.06em}
.subs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.subs span{font-size:12px;background:var(--surface-2);border-radius:4px;padding:3px 8px;color:var(--muted)}
.subs span b{color:var(--fg);font-weight:500}

/* drawer */
#drawer .scrim{position:fixed;inset:0;background:rgba(3,7,8,.62);z-index:40}
#drawer .panel{position:fixed;top:0;bottom:0;right:0;width:min(980px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 18px}
.dr-top{display:flex;justify-content:flex-end;margin-bottom:6px}
.dr-id{display:flex;gap:16px;align-items:center}
.dr-id .av{--s:92px;border-radius:12px}
.dr-id h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:48px;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.dr-id p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dr-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:20px 0 6px}
.dr-kpi div{background:var(--surface);padding:12px 12px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.dr-kpi b{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--fg);font-weight:700}
.dr-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:6px;align-items:stretch}
.idcard{border:1px solid var(--line);border-radius:12px;background:linear-gradient(155deg,#16262e,#0e171b 62%);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.idc-head{min-width:0}

.idc-photo{position:relative;width:100%;flex:1 1 auto;min-height:300px;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:64px;color:var(--muted)}
.idc-photo img.bgf{object-fit:cover;filter:blur(22px) brightness(.55);transform:scale(1.15)}
.idc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
.idc-name{margin:0;font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
.idc-scope{margin:6px 0 0;color:var(--muted);font-size:12px}
.idc-meta{margin-top:12px;color:var(--fg);font-size:15px}
.idc-meta.none{color:var(--muted)}
.idc-club{margin-top:12px;font-weight:600;font-size:16px}
.idc-club small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-bottom:1px}
.idc-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.idc-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:auto}
.idc-facts div{background:rgba(16,24,27,.92);padding:10px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.idc-facts b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:25px;line-height:1;color:var(--fg);font-weight:700}
.traits{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 14px 16px;min-width:0}
.traits h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.02em}
.traits .sub{margin:2px 0 4px;color:var(--muted);font-size:12px}
.tr-tags{display:grid;gap:8px;margin-top:6px}
.tr-tags .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tr-tags .row>span{min-width:96px}
.tg{font-style:normal;font-size:12px;border-radius:5px;padding:3px 8px;font-weight:500}
.tg.good{background:var(--win-soft);color:var(--win)}
.tg.bad{background:var(--loss-soft);color:var(--loss)}
.tr-seg{margin:6px 0 4px}
.tr-note{margin:10px 0 0;color:var(--muted);font-size:12px}
.tr-list{margin:12px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px}
.tr-list li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line-soft);padding:4px 0}
.tr-list li span{color:var(--muted)}
.tr-list li b{font-weight:600;text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip{position:relative;cursor:help}
.tip .tb{position:absolute;z-index:70;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:236px;max-width:72vw;background:#0b1316;border:1px solid #34505a;border-radius:8px;padding:9px 11px;font-family:var(--f-body);font-style:normal;font-size:12px;font-weight:400;line-height:1.45;letter-spacing:0;text-transform:none;text-align:left;color:var(--fg);white-space:normal;box-shadow:0 10px 28px rgba(0,0,0,.55);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s}
.tip:hover>.tb,.tip:focus>.tb,.tip:focus-visible>.tb{opacity:1;visibility:visible}
.tip.l>.tb{left:0;transform:none}
.tip.r>.tb{left:auto;right:0;transform:none}
.tbl th .tip>.tb{bottom:auto;top:calc(100% + 8px)}
.tbl th .tip{border-bottom:1px dotted #4a626c}
.radar{position:relative;width:100%;max-width:430px;margin:0 auto}
.radar svg{display:block;width:100%;height:auto}
.rl{position:absolute;display:flex;flex-direction:column;line-height:1.15;font-size:12px;color:var(--muted);white-space:nowrap}
.rl b{font-size:17px;color:var(--fg);font-weight:700}
.rl.t{transform:translate(-50%,-100%);align-items:center;text-align:center}
.rl.b{transform:translate(-50%,0);align-items:center;text-align:center}
.rl.r{transform:translate(0,-50%)}
.rl.l{transform:translate(-100%,-50%);align-items:flex-end;text-align:right}
.rl.t>.tb,.rl.b>.tb{left:50%;transform:translateX(-50%)}
.flag{width:22px;height:15px;border-radius:2px;border:1px solid rgba(255,255,255,.28);vertical-align:-3px;margin-right:6px}
.idc-meta .sep{display:inline-block;width:1px;height:13px;background:var(--line);margin:0 10px;vertical-align:-2px}
.dr-sec{margin-top:28px}
.dr-sec h3{margin:0 0 10px;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.03em}
.dr-sec .tablewrap table td,.dr-sec .tablewrap table th{padding:9px 9px}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.facts li{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line-soft);padding-bottom:8px;font-size:14px}
.facts li span{color:var(--muted)}
.facts li b{font-weight:600;text-align:right}
.rost{columns:2;column-gap:20px;margin:0;padding:0;list-style:none;font-size:13px}
.rost li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line-soft);break-inside:avoid}
.rost li span{color:var(--muted)}

/* modal */
#modal .scrim{position:fixed;inset:0;background:rgba(3,7,8,.7);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.dlg h3{margin:0 0 14px;font-family:var(--f-display);font-size:24px;font-weight:600}
.fgrid{display:grid;gap:12px}
.frow{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px;align-items:center}
.frow .tb{display:grid;gap:8px;min-width:0}
.frow .sc{text-align:center;font-family:var(--f-display);font-size:26px}
select,input[type=text],input[type=number],input[type=date]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
input[type=number]{text-align:center;font-family:var(--f-display);font-size:24px;padding:6px}
label.f-l{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.err{color:var(--loss);font-size:13px;min-height:18px;margin-top:10px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
.foot{margin-top:40px;color:var(--muted);font-size:12px;display:grid;gap:6px;border-top:1px solid var(--line-soft);padding-top:16px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.live{background:var(--win)}

  .rost{columns:1}
  .dr-id h2{font-size:38px}
  .dr-id .av{--s:72px}

function docOf(key){return live[key]||SEED[key]||{matches:[]}}
function scope(){return S.season==='all'?SEASONS:[S.season]}
function getMatches(mode,seasons){
  var out=[];
  (seasons||scope()).forEach(function(s){
    (docOf('s'+s+'-'+mode).matches||[]).forEach(function(m){var c=Object.assign({},m);c._s=s;out.push(c)});
  });
  out.sort(function(x,y){return (x._s-y._s)||(x.n-y.n)});
  return out;
}

/* ---------- stats ---------- */
function blank(){return {gp:0,w:0,d:0,l:0,gf:0,ga:0,form:[]}}
/* No draws: a level game is decided on penalties (m.pw = 'a' | 'b'). Level games without a penalty winner are not counted yet. */
function pw(m,side){return m.pw?(m.pw===side?'W':'L'):null}
function addRes(t,gf,ga,pen){
  var r=gf>ga?'W':gf<ga?'L':(pen||null);
  if(!r)return;
  t.gp++;t[r.toLowerCase()]++;t.gf+=gf;t.ga+=ga;t.form.push(r);
}
function pendingCount(){
  var n=0;['singles','doubles'].forEach(function(mo){getMatches(mo).forEach(function(m){if(m.sa===m.sb&&!m.pw&&!m.skip)n++})});
  return n;
}
function pct(t){return t.gp?t.w/t.gp:0}
function pctTxt(t){return t.gp?Math.round(pct(t)*100)+'%':'–'}
function gd(t){return t.gf-t.ga}
function gdTxt(t){var g=gd(t);return g>0?'+'+g:String(g)}
function rankSort(rows){return rows.slice().sort(function(a,b){
  var x=a[1],y=b[1];
  if((y.gp>0)!==(x.gp>0))return y.gp>0?1:-1;
  return (pct(y)-pct(x))||(gd(y)-gd(x))||(y.gf-x.gf)||(y.gp-x.gp);
})}
function singlesAgg(ms){
  var t={};PL.forEach(function(p){t[p]=blank()});
  ms.forEach(function(m){
    if(t[m.a])addRes(t[m.a],m.sa,m.sb,pw(m,'a'));
    if(t[m.b])addRes(t[m.b],m.sb,m.sa,pw(m,'b'));
  });
  return t;
}
function pairKey(team){return team.slice().sort(function(a,b){return PL.indexOf(a)-PL.indexOf(b)}).join(' & ')}
function allIn(team){return team.every(function(p){return PL.indexOf(p)>-1})}
function doublesAgg(ms){
  var per={},pairs={},clubs={},mu={};
  PL.forEach(function(p){per[p]=blank();clubs[p]={}});
  ms.forEach(function(m){
    [[m.a,m.sa,m.sb,m.ta,pw(m,'a')],[m.b,m.sb,m.sa,m.tb,pw(m,'b')]].forEach(function(x){
      var team=x[0],gf=x[1],ga=x[2],club=x[3],pen=x[4];
      team.forEach(function(p){
        if(!per[p])return;
        addRes(per[p],gf,ga,pen);
        if(club){clubs[p][club]=clubs[p][club]||blank();addRes(clubs[p][club],gf,ga,pen)}
      });
      if(allIn(team)){var k=pairKey(team);pairs[k]=pairs[k]||blank();addRes(pairs[k],gf,ga,pen)}
    });
    var wn=m.sa>m.sb?'a':m.sb>m.sa?'b':(m.pw||null);
    if(allIn(m.a)&&allIn(m.b)&&wn){
      var ka=pairKey(m.a),kb=pairKey(m.b),flip=ka>kb;
      var k1=flip?kb:ka,k2=flip?ka:kb,g1=flip?m.sb:m.sa,g2=flip?m.sa:m.sb;
      var key=k1+'|'+k2;
      var r=mu[key]=mu[key]||{a:k1,b:k2,aw:0,d:0,bw:0,ga:0,gb:0};
      if(flip?wn==='b':wn==='a')r.aw++;else r.bw++;
      r.ga+=g1;r.gb+=g2;
    }
  });
  return {per:per,pairs:pairs,clubs:clubs,mu:mu};
}
function dreamOwner(club,dd){var t=(dd.teams||[]).filter(function(x){return x.team===club})[0];return t?t.owner:null}
function dreamAgg(){
  var dd=docOf('s25-dream'),t={};
  PL.forEach(function(p){t[p]=blank()});
  (dd.matches||[]).forEach(function(m){
    var a=dreamOwner(m.a,dd),b=dreamOwner(m.b,dd);
    if(a&&t[a])addRes(t[a],m.sa,m.sb,pw(m,'a'));
    if(b&&t[b])addRes(t[b],m.sb,m.sa,pw(m,'b'));
  });
  return t;
}
function dreamVisible(){return false}
function bestStreak(p,ms){
  var best=0,cur=0;
  ms.forEach(function(m){
    var side=m.a===p?'a':m.b===p?'b':null;
    if(!side)return;
    var mine=side==='a'?[m.sa,m.sb]:[m.sb,m.sa];
    var r=mine[0]>mine[1]?'W':mine[0]<mine[1]?'L':pw(m,side);
    if(!r)return;
    if(r==='W'){cur++;if(cur>best)best=cur}else cur=0;
  });
  return best;
}

/* match grid */
function matchCard(m,mode){
  var a,b,ca='',cb='';
  if(mode==='singles'){a=[m.a];b=[m.b]}
  else if(mode==='doubles'){a=m.a;b=m.b;ca=m.ta;cb=m.tb}
  else{a=[dreamOwner(m.a,docOf('s25-dream'))||m.a];b=[dreamOwner(m.b,docOf('s25-dream'))||m.b];ca=m.a;cb=m.b}
  var level=m.sa===m.sb,wa=m.sa>m.sb||(level&&m.pw==='a'),wb=m.sb>m.sa||(level&&m.pw==='b'),pend=level&&!m.pw&&!m.skip;
  function row(names,club,sc,w,pen){
    return '<div class="mc-r'+(w?' win':'')+'"><div><span class="nm">'+names.map(esc).join(' &amp; ')+'</span>'+(club?'<span class="cl">'+esc(club)+'</span>':'')+'</div><span class="sc">'+sc+(pen?'<i class="pen tip r" tabindex="0">P<span class="tb" role="tooltip">Won on penalties after a level full-time score.</span></i>':'')+'</span></div>';
  }
  var act='';
  if(S.editing&&canEditUI()){
    var at=' data-s="'+m._s+'" data-mode="'+mode+'" data-n="'+m.n+'"';
    act='<div class="macts"><button class="btn sm" data-act="edit-match"'+at+'>შეცვლა</button><button class="btn sm danger" data-act="del-match"'+at+'>წაშლა</button></div>';
  }
  return '<div class="mc"><span class="mc-n">'+m.n+(pend?'<i class="pend">Penalty winner?</i>':'')+'</span>'+row(a,ca,m.sa,wa,level&&wa)+row(b,cb,m.sb,wb,level&&wb)+act+'</div>';
}
function matchGrid(mode,ms){
  if(!ms.length)return emptyBox('ამ სეზონში ჯერ არ არის მატჩი.');
  var out='',last=null;
  ms.forEach(function(m){
    if(S.season==='all'&&m._s!==last){out+='<div class="mgh">EA FC '+m._s+'</div>';last=m._s}
    out+=matchCard(m,mode);
  });
  return '<div class="mgrid">'+out+'</div>';
}
function matchSection(mode,ms,heading){

/* dream teams */
function pitchRows(form,st){
  var by=st.slice();
  function take(pos){var i=by.findIndex(function(x){return x.pos===pos});return i>-1?by.splice(i,1)[0]:{pos:pos,name:'',r:null}}
  var shapes={'4-3-3':[['LW','ST','RW'],['CLM','CRM'],['CDM'],['LB','CB','CB','RB'],['GK']],'4-2-3-1':[['ST'],['LW','CAM','RW'],['CDM','CDM'],['LB','CB','CB','RB'],['GK']]};
  return (shapes[form]||shapes['4-3-3']).map(function(row){return row.map(take)});
}
function xiAvg(st){
  var rs=st.map(function(x){return x.r}).filter(function(r){return r!=null});
  return rs.length===st.length&&rs.length?(rs.reduce(function(a,b){return a+b},0)/rs.length).toFixed(1):'–';
}
function dreamCard(t,rec){

/* one entry per match for player p in the given mode */
function modeEntries(p,mode){
  var out=[];
  getMatches(mode).forEach(function(m){
    var side=null;
    if(mode==='singles'){side=m.a===p?'a':m.b===p?'b':null}
    else{side=m.a.indexOf(p)>-1?'a':m.b.indexOf(p)>-1?'b':null}
    if(!side)return;
    var o=side==='a'?'b':'a',gf=m['s'+side],ga=m['s'+o];
    var r=gf>ga?'W':gf<ga?'L':pw(m,side);
    if(!r)return;
    var partner=null;
    if(mode==='doubles'){var tm=side==='a'?m.a:m.b;partner=tm.filter(function(x){return x!==p})[0]||null}
    out.push({gf:gf,ga:ga,r:r,m:m,side:side,o:o,partner:partner});
  });
  return out;
}
function modeRaw(p,mode){
  var E=modeEntries(p,mode),n=E.length,res={n:n};
  res.att=n?E.reduce(function(a,x){return a+x.gf},0)/n:null;
  res.def=n?E.reduce(function(a,x){return a+x.ga},0)/n:null;
  var wins=E.filter(function(x){return x.r==='W'});
  var tight=E.filter(function(x){return Math.abs(x.gf-x.ga)<=1}),tightW=tight.filter(function(x){return x.r==='W'}).length;
  var bigW=wins.filter(function(x){return x.gf-x.ga>=2}).length;
  res.dom=wins.length?bigW/wins.length:null;res.bigW=bigW;res.winN=wins.length;
  res.nrv=tight.length?tightW/tight.length:null;res.closeW=tightW;res.closeN=tight.length;
  res.team=n?wins.length/n:null;
  /* discipline: yellow=1, red=3, only matches with card data */
  var cm=E.filter(function(x){return x.m['y'+x.side]!=null||x.m['r'+x.side]!=null});
  var Y=0,Rr=0;cm.forEach(function(x){Y+=x.m['y'+x.side]||0;Rr+=x.m['r'+x.side]||0});
  res.dis=cm.length?(Y+3*Rr)/cm.length:null;res.cardN=cm.length;res.Y=Y;res.R=Rr;
  /* efficiency: 0.7*Finishing + 0.3*Dominance */
  var sm=E.filter(function(x){return x.m['sot'+x.side]!=null});
  var goals=0,sot=0;sm.forEach(function(x){goals+=x.gf;sot+=x.m['sot'+x.side]});
  var F=sot>0?Math.min(1,goals/sot):null;
  var pm=wins.filter(function(x){return x.m['p'+x.side]!=null&&x.m['p'+x.o]!=null});
  var D=pm.length?pm.filter(function(x){return x.m['p'+x.side]>x.m['p'+x.o]}).length/pm.length:null;
  res.F=F;res.D=D;res.eff=(F!=null&&D!=null)?0.7*F+0.3*D:null;

  if(mode==='doubles'){
    var by={};E.forEach(function(x){if(!x.partner||PL.indexOf(x.partner)<0)return;var z=by[x.partner]||(by[x.partner]={g:0,w:0});z.g++;if(x.r==='W')z.w++});
    var rates=Object.keys(by).filter(function(k){return by[k].g>=3}).map(function(k){return by[k].w/by[k].g});
    if(rates.length>=2){var mx=Math.max.apply(null,rates),mn=Math.min.apply(null,rates);res.adp=1-(mx-mn);res.gap=mx-mn}
    else{res.adp=null}
  }
  return res;
}
function traitScores(){
  /* absolute 0-100 scale: goals 0-4 per match map to 0-100, cards 0-2 points per match map to 100-0, the rest are percentages */
  var raw={s:{},d:{}},sc={s:{},d:{}};
  PL.forEach(function(q){
    [['s','singles'],['d','doubles']].forEach(function(mm){
      var r=modeRaw(q,mm[1]);raw[mm[0]][q]=r;sc[mm[0]][q]={};
      traitsOf(mm[1]).forEach(function(t){
        var v=r[t.k];
        sc[mm[0]][q][t.k]=v==null?null:Math.round(Math.max(0,Math.min(100,
          t.k==='att'?v/4*100:t.k==='def'?100-v/4*100:t.k==='dis'?100-v/2*100:v*100)));
      });
    });
  });
  return {raw:raw,sc:sc};

function traitText(k,r){
  var v=r[k];if(v==null)return '–';
  if(k==='att')return v.toFixed(1)+' goals / match';
  if(k==='def')return v.toFixed(1)+' conceded / match';
  if(k==='nrv')return Math.round(v*100)+'% ('+r.closeW+'/'+r.closeN+')';
  if(k==='dom')return Math.round(v*100)+'% ('+r.bigW+'/'+r.winN+')';
  if(k==='dis')return v.toFixed(1)+' pts / match ('+r.Y+' Y, '+r.R+' R)';
  if(k==='eff')return Math.round(v*100)+' (F '+Math.round(r.F*100)+'% · D '+Math.round(r.D*100)+'%)';
  if(k==='adp')return Math.round(v*100)+' (gap '+Math.round(r.gap*100)+' pts)';

function radarHtml(scores,TRAITS){
  var Wd=400,Hd=310,cx=200,cy=150,R=80,N=TRAITS.length;
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a),a]}
  function xy(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}
  function poly(f){return TRAITS.map(function(t,i){return xy(pt(i,R*f))}).join(' ')}
  var g='';
  [1/3,2/3,1].forEach(function(f){g+='<polygon points="'+poly(f)+'" fill="none" stroke="var(--line)" stroke-width="1"'+(f<1?' stroke-dasharray="3 4"':'')+'/>'});
  TRAITS.forEach(function(t,i){var q=pt(i,R);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="var(--line-soft)"/>'});
  var dp=TRAITS.map(function(t,i){var s=scores[t.k];return pt(i,R*(s==null?0.04:s/100))});
  g+='<polygon points="'+dp.map(xy).join(' ')+'" fill="rgba(228,38,62,.24)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
  dp.forEach(function(q){g+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>'});
  var labels=TRAITS.map(function(t,i){
    var q=pt(i,R+(Math.abs(Math.cos(pt(i,1)[2]))>0.35?16:10)),c=Math.cos(q[2]),sn=Math.sin(q[2]);
    var cls=sn<-0.6?'t':sn>0.6?'b':c>0?'r':'l';
    var al=cls==='l'?' l':cls==='r'?' r':'';
    var s=scores[t.k];

  }).join('');
  return '<div class="radar"><svg viewBox="0 0 '+Wd+' '+Hd+'" role="img" aria-label="Player Traits">'+g+'</svg>'+labels+'</div>';
}

  /* dream team */
  if(dreamVisible()){
    var dt=(docOf('s25-dream').teams||[]).filter(function(t){return t.owner===p})[0];

    }

  html+='</aside>';
  el.innerHTML=html;
  var np=el.querySelector('.panel');if(np&&keepTop)np.scrollTop=keepTop;

}
function writeDoc(key,data){
  return enqueue(function(){return db.doc('league/'+key).set(data)}).then(function(){return true},function(e){
    toast(e&&e.code==='invalid_argument'?'შენახვის უფლება არ გაქვს. სთხოვე მფლობელს, რომ Contributor გაგხადოს.':'ვერ შეინახა. სცადე ხელახლა.');
    return false;
  });
}
function saveMatch(){
  var f=readForm();
  if(f.error){$('#f-err').textContent=f.error;return}
  var key='s'+f.season+'-'+f.mode,cur=docOf(key),list=(cur.matches||[]).slice();
  if(f.n!=null){list=list.map(function(m){return m.n===f.n?Object.assign({},f.match,{n:f.n}):m})}
  else{var nn=list.reduce(function(a,m){return Math.max(a,m.n)},0)+1;list.push(Object.assign({},f.match,{n:nn}))}
  var data=Object.assign({},cur,{matches:list});
  var btn=document.querySelector('[data-act="save-match"]');if(btn)btn.disabled=true;
  writeDoc(key,data).then(function(ok){if(ok){closeEditor();toast(f.n!=null?'მატჩი შეიცვალა':'მატჩი დაემატა')}else if(btn)btn.disabled=false});
}
var pendingDel=null;
function deleteMatch(s,mode,n,btn){
  var id=s+'|'+mode+'|'+n;
  if(pendingDel!==id){pendingDel=id;btn.textContent='დაადასტურე წაშლა';setTimeout(function(){if(pendingDel===id){pendingDel=null;if(btn.isConnected)btn.textContent='წაშლა'}},4000);return}
  pendingDel=null;
  var key='s'+s+'-'+mode,cur=docOf(key);
  writeDoc(key,Object.assign({},cur,{matches:(cur.matches||[]).filter(function(m){return m.n!==n})})).then(function(ok){if(ok)toast('მატჩი წაიშალა')});
}

/* photos */
function resizeImage(file,max){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',.88);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function uploadPhoto(p,file){
  toast('ფოტო იტვირთება…');
  resizeImage(file,720).then(function(b){return assets.upload(b,{type:'image/jpeg'})}).then(function(r){
    return enqueue(function(){return db.doc('players/'+p).set(Object.assign({},bios[p]||{},{photo:r.id}))});
  }).then(function(){toast('ფოტო შეინახა')},function(){toast('ფოტოს ატვირთვა ვერ მოხერხდა')});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var dl=e.target.closest('.dlg');
  var el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.classList.contains('scrim')&&dl)return;
  var act=el.dataset.act;
  if(act==='season'){S.season=el.dataset.v;persist();render()}
  else if(act==='view'){S.view=el.dataset.v;persist();render()}
  else if(act==='mode'){S.mode=el.dataset.v;persist();render()}
  else if(act==='tmode'){S.tm=el.dataset.v;render()}
  else if(act==='formn'){S.formN=Number(el.dataset.v);persist();render()}
  else if(act==='profile'){S.profile=el.dataset.p;render()}
  else if(act==='close'){S.profile=null;render()}
  else if(act==='edit-toggle'){S.editing=!S.editing;render()}
  else if(act==='add-match'){openEditor(el.dataset.mode,S.season==='all'?'27':S.season,null)}
  else if(act==='edit-match'){openEditor(el.dataset.mode,el.dataset.s,Number(el.dataset.n))}
  else if(act==='del-match'){deleteMatch(el.dataset.s,el.dataset.mode,Number(el.dataset.n),el)}
  else if(act==='save-match'){saveMatch()}
  else if(act==='cancel-edit'){closeEditor()}
  else if(act==='edit-bio'){openBioEditor(el.dataset.p)}
  else if(act==='save-bio'){saveBio()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('#modal').innerHTML)closeEditor();else if(S.profile){S.profile=null;render()}}
  else if(e.key==='Enter'){var t=e.target;if(t&&t.matches&&t.matches('tr[data-act]')){S.profile=t.dataset.p;render()}}
});
document.addEventListener('change',function(e){
  var inp=e.target.closest&&e.target.closest('input[data-up]');
  if(inp&&inp.files&&inp.files[0]){uploadPhoto(inp.dataset.up,inp.files[0]);inp.value=''}
});

/* ---------- boot ---------- */
render();
(async function(){
  try{
    if(!window.claude||!window.claude.use){booted=true;render();return}
    db=await window.claude.use('db');
    booted=true;
    if(!db){render();return}
    try{var user=await window.claude.use('user');if(user)canWrite=await user.can('data.write')}catch(e){}
    try{assets=await window.claude.use('assets')}catch(e){}
    loadTimer=setTimeout(function(){if(!liveOk){toast('მონაცემებთან დაკავშირება ჭირს. ნაჩვენებია ბოლო ცნობილი ვერსია.')}},10000);
    DOCKEYS.forEach(function(k){
      db.doc('league/'+k).onSnapshot(function(snap){
        if(snap.exists)live[k]=snap.data();else delete live[k];
        if(!snap.metadata.fromCache){liveOk=true;clearTimeout(loadTimer)}
        schedule();
      },function(){schedule()});
    });
    PL.forEach(function(p){
      db.doc('players/'+p).onSnapshot(function(snap){
        var d=snap.exists?snap.data():null;
        bios[p]=d||PSEED[p]||{};
        if(d&&d.photo)photos[p]=d.photo;else if(PSEED[p])photos[p]=PSEED[p].photo;else delete photos[p];
        schedule();
      },function(){});
    });
    render();
  }catch(err){render()}
})();
})();
</script>
